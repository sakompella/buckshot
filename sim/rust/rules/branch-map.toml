# The hand-kept part of the Bend <-> Rust branch map; `cargo branch-map check`
# reads it with the Bend sources and the rules crate's Rust.

# Bend defs whose cases have no Rust arm. Each is representation plumbing:
# a Bend data structure the Rust types replace, whose cases select a field or
# position and cannot change a rules outcome on their own. Their effect is
# compared on every tape step through the states, menus and notes.
[exempt]
"domain:seat.eq" = "seat equality by constructor pairs; Rust derives PartialEq on Seat"
"domain:item.godot_id" = "item ids for item.eq; Rust derives PartialEq on Item"
"domain:ring.fill" = "builds a per-table ring; Rust's Ring is a [T; 4] with its Table"
"domain:ring.get" = "ring field by seat; Ring::get indexes the array, None off the table as Bend's None"
"domain:ring.set" = "ring field by seat; Ring::set writes the array, a no-op off the table as in Bend"
"domain:ring.entries" = "ring as a seat list; Ring::entries iterates the table's seats in socket order"
"domain:slots.get" = "slot field by slot; Slots is [Option<Item>; 8]"
"sm/items:slots.put" = "slot field write by slot; Slots::put writes the array"
"domain:rules.item" = "item rule field by item; Items indexes an array by Item::rank"
"domain:plan.length" = "round plan length by constructor; Config stores the rounds and their count"
"domain:plan.round" = "round plan field by index; Config::round indexes the array"
"domain:clamp" = "Nat recursion computing min(n, top); Range::value clamps with one comparison (the --wild tapes feed out-of-range answers)"
"sm/rules:subtract" = "Nat recursion for truncated subtraction; Rust uses saturating_sub"
"sm/rules:nth" = "list index; Gun::nth and fixed arrays"
"sm/rules:replace" = "list write by index; Gun::set"
"sm/rules:remove" = "list removal by index; Deck::remove"
"sm/rules:repeat" = "list of n copies; Gun::from_shells"
"sm/state:players.health" = "per-table ring projection; Rust reads SeatRecord fields of one Ring"
"sm/state:players.jam" = "per-table ring projection; Rust reads SeatRecord fields of one Ring"
"sm/state:players.cash" = "per-table ring projection; Rust reads SeatRecord fields of one Ring"
"sm/state:players.slots" = "per-table ring projection; Rust reads SeatRecord fields of one Ring"
"sm/state:players.reset" = "per-table ring rebuild; Rust rewrites the Ring's records"
"sm/state:decks.get" = "deck field by table; Decks::get"
"sm/state:decks.set" = "deck field write by table; Decks::set"
"simple/point:moves" = "maps a menu to its moves; Menu::moves maps the ArrayVec"
"simple/point:option.nth" = "menu index; Menu::clamped indexes the ArrayVec after Bend's clamp"
"simple/state:log.list" = "the log as a list; Rust keeps no log in State, each Stepped carries its notes"
"simple/point:items.has" = "membership scan of a seen-items list; Rust uses Items::contains"
"simple/point:picks.has" = "membership scan of a seen-picks list; Rust uses ArrayVec::contains"
"simple/point:seats.has" = "membership scan of a seen-seats list; Rust uses Seats::contains"
"simple/point:seated" = "ring.get over a ring filled with True, i.e. table.has(seat); the Rust `if table.has` carries SimplePointIdleRequestTrue/False"

# Bend branches with more than one Rust site: variant = { count, reason }.
[sites]
"SimplePointUseFirstTakeGunCons" = { count = 0, reason = "Rust's Uses holds only UseAt entries; the TakeGun entry of Bend's IdleOption list is not in the list" }
"SimplePointUseOptionsTakeGunCons" = { count = 0, reason = "Rust's Uses holds only UseAt entries; the TakeGun entry of Bend's IdleOption list is not in the list" }

# Rust control flow with no Bend branch of its own, keyed by file, file:fn,
# or file:fn:<kind> <expr> as `cargo branch-map check` prints it.
[rust_only]
"domain.rs:Seat::index" = "array position of a seat; Bend has no counterpart"
"domain.rs:Table::has" = "seat membership of a table by constructor pairs; Bend reads it through ring.get over a filled ring"
"domain.rs:Seats::push" = "bounded append to the fixed-capacity seat list; capacity is a Rust representation limit"
"domain.rs:Seats::insert" = "set-style append used for Bend's seen-seats list; Bend's seats.has scan is exempt"
"domain.rs:Ring::get" = "ring field by seat; Bend's ring.get is exempt, Rust bounds the seat against the table"
"domain.rs:Ring::set" = "ring field write by seat; Bend's ring.set is exempt, Rust bounds the seat against the table"
"domain.rs:bit" = "shell bit mask of the packed Gun; Rust representation of the Bend shell list"
"domain.rs:Gun::from_shells" = "packs a shell list into the Gun bit set; Bend's repeat is exempt"
"domain.rs:Gun::nth" = "shell by index in the packed Gun; Bend's nth is exempt"
"domain.rs:Gun::split_first" = "head and tail of the packed Gun; the Bend match on the gun list is labelled at its call sites"
"domain.rs:Gun::push_front" = "prepends a shell to the packed Gun; capacity is a Rust representation limit"
"domain.rs:Gun::set" = "shell write by index in the packed Gun; Bend's replace is exempt"
"domain.rs:Item::rank" = "array position of an item; Bend's rules.item is exempt"
"domain.rs:Slot::index" = "array position of a slot; Bend's slots.get/put are exempt"
"domain.rs:Slots::put" = "slot write by slot; Bend's slots.put is exempt"
"domain.rs:Config::new" = "validates the round plan on construction; Bend builds plans from constructors that cannot be malformed"
"domain.rs:Config::round" = "round plan field by index; Bend's plan.round is exempt"
"domain.rs:Range::value" = "clamps an answer into the range; Bend's clamp is exempt"
"state.rs:Deck::remove" = "deck list removal by index; Bend's remove is exempt"
"state.rs:Decks::get" = "deck field by table; Bend's decks.get is exempt"
"state.rs:Decks::set" = "deck field write by table; Bend's decks.set is exempt"
"items.rs:Needs::set" = "per-seat slot of the needs array; Bend builds a list by recursion"
"lib.rs:Notes::push" = "bounded note log; capacity is a Rust representation limit"
"lib.rs:answer_idle:match event" = "wrong event kind for an Idle menu: a Rust-only error, Bend answers are untyped"
"lib.rs:answer_request:match event" = "wrong event kind for a Draw request: a Rust-only error, Bend answers are untyped"
"lib.rs:answer_request:match event #2" = "wrong event kind for a Choose request: a Rust-only error, Bend answers are untyped"
"machine.rs:step_into:match value.get()" = "index of the answered value into the request list; list plumbing"
"items.rs:steal_owner:for pick in slots" = "walks one owner's slots building picks; the Bend arms are the labelled keep sites inside"
"machine.rs:round_reset:for (seat, record) in r.state.players.entries()" = "rebuilds the ring of records; Bend's players.reset is exempt"
"items.rs:occupied:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"items.rs:stocked:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"items.rs:holders:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"machine.rs:grant_step:loop " = "tail recursion of grant.step as a loop; every arm is labelled"
"machine.rs:seats_after:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"machine.rs:grab_loop:loop " = "fuel-bounded tail recursion of grab.loop as a loop; the Bend branches are labelled in its body"
"rules.rs:living:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"rules.rs:aim_targets:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"
"rules.rs:successor_go:loop " = "loop over a list written as `match` on the iterator: every arm of it is labelled; the loop itself is the recursion"

# Bend defs whose cases the trace comparison does not time: pure functions of
# the config (or of a constant) that Rust recomputes where Bend computes once
# or ahead of time, so Rust may take their cases in a call where Bend did not.
# Their values reach every compared state and note.
[untimed]
"domain:table.seats" = "the table's seats; Rust asks Table::seats at each use"
"domain:table.deck" = "the table's starting deck; Rust builds it where it uses it"
"domain:table.health_range" = "the table's health range; a constant per table"
"domain:table.amount_range" = "the table's item amount range; a constant per table"
"domain:item.dealt_at" = "whether a table deals an item; a constant per table and item"
