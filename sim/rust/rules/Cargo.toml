[package]
name = "buckshot-rules"
version = "0.1.0"
description = "The Buckshot simple machine's rules, mirrored from sim/bend-mp (Bend is the source of truth)."
edition.workspace = true
publish.workspace = true

[features]
default = ["seats-2-4"]
# The tables the rules hold; exactly one. `seats-2-4` is every table; `seats-2`
# drops the three- and four-seat tables, so a ring stores two seats:
# --no-default-features --features seats-2 (for buckshot-search, f64,seats-2).
seats-2-4 = []
seats-2 = []
# Records each `branch!` label as it runs (for the trace comparison).
trace = []

[dependencies]
arrayvec.workspace = true
enum-map.workspace = true
num_enum.workspace = true
thiserror.workspace = true

[dev-dependencies]
hegeltest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
