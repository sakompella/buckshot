[package]
name = "branch-map"
version = "0.1.0"
description = "Generates the rules crate's Bend branch ids from the Bend sources and checks every Rust rules arm against them."
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
toml.workspace = true

[lints]
workspace = true
