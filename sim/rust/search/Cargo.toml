[package]
name = "buckshot-search"
version = "0.1.0"
description = "The Buckshot minimax player (sim/bend-mp/player), mirrored from Bend over buckshot-rules."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["f64", "seats-2-4"]
# The player's arithmetic; exactly one. `f32` is Bend's F32, bit for bit, and
# the only build with the compat evaluator:
# --no-default-features --features f32,seats-2-4.
f32 = []
f64 = []
# The tables, as buckshot-rules' features; exactly one.
seats-2-4 = ["buckshot-rules/seats-2-4"]
seats-2 = ["buckshot-rules/seats-2"]

[dependencies]
anyhow.workspace = true
arrayvec.workspace = true
buckshot-rules = { path = "../rules", default-features = false }
clap.workspace = true
hashbrown.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
buckshot-rules = { path = "../rules", default-features = false, features = ["testing"] }
hegeltest.workspace = true

[lints]
workspace = true
