[workspace]
resolver = "3"
members = ["rules", "branch-map"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
arrayvec = { version = "0.7", default-features = false }
proptest = "1"
proc-macro2 = "1"
quote = "1"
serde = "1"
sha2 = "0.10"
syn = "2"
toml = "0.9"
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Rules code mirrors Bend: one match arm per Bend case, each opening with `branch!`.
single_match_else = "allow"
match_bool = "allow"
# World and Grabs mirror Bend's records field for field.
struct_excessive_bools = "allow"

[profile.release]
debug = 1
