# The checks of AGENTS.md that need no private data: the flake checks (the
# Rust hooks and the tools/arena tests) and the web lint, typecheck and tests,
# with Bend and bun from the dev shell.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - name: web
        working-directory: web
        run: nix develop .. -c bash -c 'bun install --frozen-lockfile && bun run rules && bun run lint && bun run typecheck && bun run test'
