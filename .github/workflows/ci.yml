# The checks of AGENTS.md that need no private data. Every push to main and every pull request runs the flake checks
# (the Rust hooks; the tools/arena and dev tests with ruff, ruff format and ty), the web checks, `cargo test` and the Bend
# domain proofs. The slow gates (all of sim/bend-mp/check.sh and the Rust-against-Bend parity of sim/rust/check.sh) run
# weekly and on request. Docs-only changes skip the workflow.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: nix flake check -L
      - name: web
        working-directory: web
        # `bun run test` builds the rules first, which lint and typecheck need.
        run: nix develop .. -c bash -c 'bun install --frozen-lockfile && bun run test && bun run lint && bun run typecheck && bun run test:lint-rules'
      - name: sim
        run: nix develop -c bash -c 'bend sim/bend-mp/domain.bend --verdict | grep -q "ALL PROOFS CHECK" && cd sim/rust && cargo test'
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: nix develop -c bash sim/bend-mp/check.sh
      - run: nix develop -c bash sim/rust/check.sh
