[project]
name = "buckshot-dev"
version = "0.1.0"
description = "Buckshot developer commands: heavy jobs, checks, wrap-up"
requires-python = ">=3.12"
# numpy, pandas, scikit-learn and hypothesis are not used by `dev` itself: dev/ is also the
# Python env for the tools/arena scripts and analyses and their tests (`nix develop`, the arena-python flake check).
dependencies = [
    "numpy>=2",
    "hypothesis>=6",
    "scikit-learn>=1.5",
    "pandas>=2",
]

[project.scripts]
dev = "buckshot_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buckshot_dev"]
