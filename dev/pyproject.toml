[project]
name = "buckshot-dev"
version = "0.1.0"
description = "Buckshot developer commands: heavy jobs, checks, wrap-up"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "hypothesis>=6"]

[project.scripts]
dev = "buckshot_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buckshot_dev"]
